<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="t d">
<title id="t">Recovered interaction loop — Audio Generator</title>
<desc id="d">The tone starts on its own; the sliders steer it; GDScript refills the buffer every frame. References: M-01 M-02 M-03 M-04 S-01 F-04.</desc>
